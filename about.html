<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portfolio | About</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">STUDENT PORTFOLIO</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html" class="active">About</a>
            <a href="feedback.html">Feedback</a>
        </nav>
    </header>


    <main class="about-container">

        <section class="page-heading">
            <h1>My Portfolio</h1>
            <p>Welcome to my personal portfolio!</p>
        </section>


        <section class="portfolio-layout">

            <div class="profile-section">

                <img
                    id="profileImage"
                    class="profile-image"
                    src="https://placehold.co/180x180?text=Profile"
                    alt="Student Profile">

                <h2 id="displayName">Loading...</h2>

                <p id="displayEmail"></p>

                <p id="displayPhone"></p>

            </div>


            <div class="details-section">

                <div class="detail-card">
                    <h2>About Me</h2>
                    <p id="displayIntro"></p>
                </div>


                <div class="detail-card">
                    <h2>Education</h2>
                    <p id="displayEducation"></p>
                </div>


                <div class="detail-card">
                    <h2>My Skills</h2>
                    <p id="displaySkills"></p>
                </div>


                <div class="detail-card">
                    <h2>My Projects</h2>
                    <p id="displayProjects"></p>
                </div>


                <div class="detail-card">
                    <h2>Achievements</h2>
                    <p id="displayAchievements"></p>
                </div>

            </div>

        </section>


        <div class="back-button">
            <a href="index.html">Create Another Portfolio</a>
        </div>

    </main>


    <script src="js/about.js"></script>

</body>

</html>
